[project]
name = "llmsci"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "numpy>=1.26",
    "kaggle>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmsci"]
