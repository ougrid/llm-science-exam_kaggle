[project]
name = "llmsci"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "numpy>=1.26",
    "kaggle>=2.2",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "torch>=2.7",
    "transformers>=4.46",
    "accelerate>=1.0",
    "scikit-learn>=1.5",
    "sentencepiece>=0.2",
    "datasets>=5.0.1",
    "bm25s>=0.3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmsci"]
